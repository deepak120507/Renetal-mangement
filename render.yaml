services:
  - type: web
    name: rental-house-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        value: jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/rental_house_db?createDatabaseIfNotExist=true&sslMode=VERIFY_IDENTITY&serverTimezone=UTC
      - key: DB_USERNAME
        value: 2sNCzaayyhTB8k8.root
      - key: DB_PASSWORD
        value: 6VdGnBE4D7FSbjt5
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
