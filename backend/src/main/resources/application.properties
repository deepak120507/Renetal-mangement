# Server configuration
server.port=${PORT:8080}
server.address=0.0.0.0

# Database DataSource configuration
spring.datasource.url=${DB_URL:jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/rental_house_db?createDatabaseIfNotExist=true&sslMode=VERIFY_IDENTITY&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:2sNCzaayyhTB8k8.root}
spring.datasource.password=${DB_PASSWORD:6VdGnBE4D7FSbjt5}

# HikariCP Connection Pool (Optimized for Render Free Tier)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator & Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Static resources (for local frontend serving fallback)
spring.web.resources.static-locations=file:../forntend/,file:../frontend/,classpath:/static/

# JWT Configuration
jwt.secret=${JWT_SECRET:local-development-secret-change-this-12345678901234567890123456789012}
jwt.expiration=${JWT_EXPIRATION:86400000}